# The all-in-one install: everything naviseerr needs, in one `docker compose up -d`. Settings come from
# .env next to this file (copy .env.example). Developers running the server from an IDE use
# compose.dev.yaml instead.
#
# No container_name anywhere and no named volumes: everything is scoped to the project name below
# (the developer stack in compose.dev.yaml is `naviseerr`), so this stack never touches the
# developer stack's containers or its database.
name: naviseerr-app

services:
  # Not published: only naviseerr talks to it, and a published 5432 would clash with any Postgres
  # already on this machine.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naviseerr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naviseerr}
      POSTGRES_DB: ${POSTGRES_DB:-naviseerr}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naviseerr} -d ${POSTGRES_DB:-naviseerr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Wraps ytmusicapi and backs search. Built straight from GitHub (that repo is named ytmusicapi), so
  # no second checkout is needed. Health check comes from the image's own HEALTHCHECK.
  ytmusic-adapter:
    build: https://github.com/catacomb5099/ytmusicapi.git#move-fast-break-things
    restart: unless-stopped
    environment:
      YTM_LOG_LEVEL: ${YTM_LOG_LEVEL:-INFO}
      YTM_TIMEOUT_SECONDS: ${YTM_TIMEOUT_SECONDS:-10}

  naviseerr:
    build: .
    # Runs as your own user (PUID/PGID in .env), not root, so the files it writes are yours.
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ytmusic-adapter:
        condition: service_healthy
    environment:
      # The weekly curator trigger runs on this clock; the container is on UTC otherwise.
      TZ: ${TZ:-Etc/UTC}
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-naviseerr}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-naviseerr}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-naviseerr}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-naviseerr}
      YT_MUSIC_SERVICE_URL: http://ytmusic-adapter:8000
      # Your own slskd, from .env.
      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      CURATOR_URL: http://croissant:8010
      CURATOR_TOKEN: ${CURATOR_TOKEN:-}
    ports:
      - "${NAVISEERR_API_PORT:-8080}:8080"

  # Builds the weekly "suggested playlists" editions (see application.yaml `curator:`). Opt-in:
  # `docker compose --profile curator up -d`, with CURATOR_TOKEN set in .env (the curator refuses to
  # start without it, and naviseerr sends the same value).
  croissant:
    profiles: ["curator"]
    build: https://github.com/catacomb5099/croissant.git#main
    restart: unless-stopped
    environment:
      CURATOR_TOKEN: ${CURATOR_TOKEN:-}
    # One volume per state folder, not one at /app, which would hide the image's categories.yaml.
    volumes:
      - curator-output:/app/output
      - curator-history:/app/history
      - curator-runs:/app/runs

volumes:
  postgres-data:
  curator-output:
  curator-history:
  curator-runs:
