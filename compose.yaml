# The all-in-one install: everything naviseerr needs, its own slskd included, in one
# `docker compose up -d`. Settings come from .env next to this file (copy .env.example;
# SOULSEEK_USERNAME is the only one you must fill in). Developers running the server from an IDE use
# compose.dev.yaml instead.
#
# No container_name anywhere and no fixed volume names: everything is scoped to the project name
# below (the developer stack in compose.dev.yaml is `naviseerr`), so this stack never touches the
# developer stack's containers or its database.
name: naviseerr-app

services:
  # Not published: only naviseerr talks to it, and a published 5432 would clash with any Postgres
  # already on this machine.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naviseerr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naviseerr}
      POSTGRES_DB: ${POSTGRES_DB:-naviseerr}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naviseerr} -d ${POSTGRES_DB:-naviseerr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Wraps ytmusicapi and backs search. Built straight from GitHub (that repo is named ytmusicapi), so
  # no second checkout is needed. Health check comes from the image's own HEALTHCHECK.
  ytmusic-adapter:
    build: https://github.com/catacomb5099/ytmusicapi.git#move-fast-break-things
    restart: unless-stopped
    environment:
      YTM_LOG_LEVEL: ${YTM_LOG_LEVEL:-INFO}
      YTM_TIMEOUT_SECONDS: ${YTM_TIMEOUT_SECONDS:-10}

  # Runs once on every `docker compose up`, as root, then exits: gives the folders below to PUID:PGID,
  # checks SOULSEEK_USERNAME, generates the passwords and slskd's API key once, and writes slskd's
  # config. slskd and naviseerr wait for it to succeed; if it fails, `docker compose logs setup` says
  # why. See docker/setup.sh.
  setup:
    image: alpine:3.20
    restart: "no"
    entrypoint: ["sh", "/setup.sh"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # No name in .env: `up`, `build` and `config` stop at once with this sentence, before the long
      # first build (stop, down, logs and ps still work). setup.sh checks the rest (length, characters).
      SOULSEEK_USERNAME: ${SOULSEEK_USERNAME:?Set SOULSEEK_USERNAME in .env, see README step 2}
      SOULSEEK_PASSWORD: ${SOULSEEK_PASSWORD:-}
      SHARE_LIBRARY: ${SHARE_LIBRARY:-true}
    volumes:
      - ./docker/setup.sh:/setup.sh:ro
      - config:/config
      - slskd:/slskd
      - downloads:/downloads
      - incomplete:/incomplete
      - ${LIBRARY_DIR:-./library}:/library

  # The Soulseek client. Its settings live in slskd.yml, written by `setup` from .env: change .env,
  # not that file.
  slskd:
    image: slskd/slskd:0.26.0
    # `user:`, not PUID/PGID variables: slskd refuses to start with both, and this way it never
    # re-owns anything. Same user as naviseerr, which moves and deletes what slskd downloads.
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      # Soulseek peers connect to you here. The host port must stay 50300 (slskd tells the network
      # this number). Forward TCP 50300 on your router to this machine for the best results: without
      # it you see fewer search results and some downloads fail. slskd cannot open it by itself
      # (no UPnP).
      - "50300:50300"
      # slskd's own web page is not published: naviseerr is the way in. To look at it anyway, from this
      # machine only, put this in a compose.override.yaml next to this file (git ignores it, so
      # `git pull` keeps working), run `docker compose up -d` and open http://localhost:5030:
      #   services: {slskd: {ports: ["127.0.0.1:5030:5030"]}}
      # Log in as slskd with the web password from `docker compose exec slskd cat /app/slskd.yml`.
    volumes:
      - slskd:/app
      - downloads:/downloads
      - incomplete:/incomplete
      # What you share on Soulseek (SHARE_LIBRARY in .env). Read-only: slskd only lists and uploads.
      - ${LIBRARY_DIR:-./library}:/music:ro
    # The image's own check waits 60 minutes before it may report a problem.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5030/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  naviseerr:
    build: .
    # One user for every container that touches the music files, so each can move what the other wrote.
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ytmusic-adapter:
        condition: service_healthy
      # Started, not healthy: a Soulseek login problem must not keep the web app from starting.
      slskd:
        condition: service_started
    environment:
      # The weekly curator trigger runs on this clock; the container is on UTC otherwise.
      TZ: ${TZ:-Etc/UTC}
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-naviseerr}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-naviseerr}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-naviseerr}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-naviseerr}
      YT_MUSIC_SERVICE_URL: http://ytmusic-adapter:8000
      SLSKD_URL: http://slskd:5030/api/v0/
      # The same volumes at the same paths as in slskd, so the library organiser is on: each finished
      # song is filed into the library, and each finished playlist becomes a .m3u8 there.
      SLSKD_DOWNLOADS_DIR: /downloads
      SLSKD_INCOMPLETE_DIR: /incomplete
      LIBRARY_ROOT: /library
      # SLSKD_API_KEY comes from this file, written by `setup`. Do NOT also set it here: an environment
      # variable, even an empty one, wins over the file.
      SPRING_CONFIG_IMPORT: optional:file:/config/naviseerr.properties
      CURATOR_URL: http://croissant:8010
      CURATOR_TOKEN: ${CURATOR_TOKEN:-}
    # Not published: the web app below forwards /api to it. To call the API directly while debugging,
    # add  services: {naviseerr: {ports: ["8080:8080"]}}  to compose.override.yaml (see slskd above).
    volumes:
      - config:/config:ro
      - downloads:/downloads
      - incomplete:/incomplete
      # Your music library: point Navidrome or Jellyfin at the same folder (LIBRARY_DIR in .env).
      - ${LIBRARY_DIR:-./library}:/library

  # The web app, and the address you open: http://<this machine>:5056. It forwards /api to naviseerr.
  # Built from GitHub: needs naviseerr-client's container change (its Dockerfile + Caddyfile) merged
  # into move-fast-break-things first.
  client:
    build: https://github.com/catacomb5099/naviseerr-client.git#move-fast-break-things
    restart: unless-stopped
    depends_on:
      naviseerr:
        condition: service_started
    ports:
      # 5056, not 5055: Jellyseerr and Overseerr already use 5055.
      - "${NAVISEERR_PORT:-5056}:80"

  # Builds the weekly "suggested playlists" editions (see application.yaml `curator:`). Opt-in:
  # `docker compose --profile curator up -d`, with CURATOR_TOKEN set in .env (the curator refuses to
  # start without it, and naviseerr sends the same value).
  croissant:
    profiles: ["curator"]
    build: https://github.com/catacomb5099/croissant.git#main
    restart: unless-stopped
    environment:
      CURATOR_TOKEN: ${CURATOR_TOKEN:-}
    # One volume per state folder, not one at /app, which would hide the image's categories.yaml.
    volumes:
      - curator-output:/app/output
      - curator-history:/app/history
      - curator-runs:/app/runs

volumes:
  postgres-data:
  # setup's generated secrets and naviseerr's copy of slskd's API key.
  config:
  # slskd's config and its own database.
  slskd:
  # slskd downloads here; naviseerr then moves each finished song into the library.
  downloads:
  incomplete:
  curator-output:
  curator-history:
  curator-runs:
