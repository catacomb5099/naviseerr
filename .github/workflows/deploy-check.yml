# Checks that deploy/compose.yaml (the copy-paste install) is still a valid compose file, so a typo in
# it never reaches someone's TrueNAS.
name: deploy-check

on:
  pull_request:
    paths: [deploy/**]
  push:
    branches: [move-fast-break-things]
    paths: [deploy/**]

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml config -q
