# Publishes this repo's Docker image to GitHub Packages: ghcr.io/${{ github.repository }}.
#   push to move-fast-break-things -> :develop and :<next version>-develop.<run number>
#                                     (the test channel: built on every change, may break)
#   push of a tag like v1.2.3       -> :1.2.3, :1.2, :1 and :latest (stable)
#   pull request                    -> builds for amd64 only and pushes nothing, so a broken
#                                     Dockerfile shows up before it is merged
# "Next version" is the version this project is working towards: `version` in build.gradle, without -SNAPSHOT.
name: image

on:
  push:
    branches: [move-fast-break-things]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Next version
        id: version
        run: |
          version=$(sed -n "s/^version = '\\(.*\\)'$/\\1/p" build.gradle | sed 's/-SNAPSHOT$//')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/move-fast-break-things' }}
            type=raw,value=${{ steps.version.outputs.version }}-develop.${{ github.run_number }},enable=${{ github.ref == 'refs/heads/move-fast-break-things' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
