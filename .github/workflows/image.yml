# Publishes this repo's two Docker images to GitHub Packages: ghcr.io/catacomb5099/naviseerr (the app)
# and ghcr.io/catacomb5099/naviseerr-setup (docker/setup.sh, run once before the app starts).
# Both get the same tags:
#   you press Run workflow          -> :develop and :<next version>-develop.<run number>
#   on move-fast-break-things          (the test channel: only when you choose, may break).
#                                     GitHub: Actions → image → Run workflow, branch
#                                     move-fast-break-things. Terminal: gh workflow run image
#                                     --repo catacomb5099/naviseerr --ref move-fast-break-things
#   push of a tag like v1.2.3       -> :1.2.3, :1.2, :1 and :latest (stable)
#   pull request                    -> builds for amd64 only and pushes nothing, so a broken
#                                     Dockerfile shows up before it is merged
# "Next version" is the version this project is working towards: `version` in build.gradle, without -SNAPSHOT.
name: image

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
  # No pull_request here: master has no Dockerfile until move-fast-break-things is merged into it,
  # and that merge brings the full copy of this file, check included.

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: naviseerr
            context: .
            file: Dockerfile
          - image: naviseerr-setup
            context: docker
            file: docker/setup.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Next version
        id: version
        run: |
          version=$(sed -n "s/^version = '\\(.*\\)'$/\\1/p" build.gradle | sed 's/-SNAPSHOT$//')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/catacomb5099/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/move-fast-break-things' }}
            type=raw,value=${{ steps.version.outputs.version }}-develop.${{ github.run_number }},enable=${{ github.ref == 'refs/heads/move-fast-break-things' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
