# naviseerr, ready to paste: the whole app from ready-made images, nothing to download or build.
#
# TrueNAS SCALE 24.10 or newer
#   1. A folder for your music: Datasets → Add Dataset (e.g. tank/media/music), Dataset Preset "Apps".
#      Then Edit Permissions and make sure the "apps" user (568) may write to it.
#   2. Apps → Discover Apps → ⋮ (top right) → Install via YAML. Name it naviseerr, paste this whole
#      file, and change the music folder line below to your dataset's path (/mnt/<pool>/...).
#      On TrueNAS that is the only line you must change. Save.
#   3. Wait until the app says Running, then open http://<your NAS>:5056.
#      Your Soulseek account was made up on the first start: Apps → naviseerr → the "setup"
#      container's logs show its name and password. Keep them; a Soulseek password cannot be reset.
#   If it does not start, the setup container's logs say why, in plain words.
#
# Other Linux / Docker: save this as compose.yaml in an empty folder, change the music folder and the
# user lines below, then `docker compose up -d`.
#
# These are develop builds: the newest code, published when the developer chooses. They can break.

# ───── EDIT THESE ──────────────────────────────────────────────────────────────────────────────────
# Your music folder. Must already exist: every song and playlist ends up here. Point Navidrome or
# Jellyfin at the same folder. TrueNAS: a dataset path such as /mnt/tank/media/music.
x-library-path: &library-path /mnt/tank/media/music
# The user (uid:gid) every container that touches your music runs as; it must be able to write to the
# folder above. TrueNAS: "568:568", its built-in apps user (give the dataset to "apps"). Other Linux:
# the numbers `id -u` and `id -g` print for the folder's owner, often "1000:1000".
x-run-as: &run-as "568:568"
# Your time zone (the weekly suggested playlists run Mondays at 03:00 on this clock).
x-tz: &tz Etc/UTC
# Share your library with other Soulseek users ("true" or "false"). Sharing gets you better downloads.
x-share-library: &share-library "true"
# Optional. Leave empty and a Soulseek account is made up for you on the first start (its name and
# password are printed in the setup container's log: keep them). Set both to use your own account.
x-soulseek-username: &soulseek-username ""
x-soulseek-password: &soulseek-password ""
# Optional: a free Discogs token (discogs.com → Settings → Developers) speeds up the suggested playlists.
x-discogs-token: &discogs-token ""
# The web page's port is under client → ports at the bottom (5056). Port 50300 must stay 50300, and
# forwarding TCP 50300 on your router to this machine gets you more search results.
# ───────────────────────────────────────────────────────────────────────────────────────────────────

x-library: &library
  type: bind
  source: *library-path
  target: /library
  bind:
    # A mistyped path stops the start instead of quietly filling a new empty folder.
    create_host_path: false

services:
  # Only naviseerr talks to it; not published.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: naviseerr
      POSTGRES_PASSWORD: naviseerr
      POSTGRES_DB: naviseerr
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naviseerr -d naviseerr"]
      interval: 5s
      timeout: 5s
      retries: 10

  # YouTube Music search.
  ytmusic-adapter:
    image: ghcr.io/catacomb5099/ytmusicapi:develop
    restart: unless-stopped

  # Runs once on every start, as root, then exits: gives the folders to the user above, makes up the
  # Soulseek account and the passwords between the containers, and writes slskd's settings. If the app
  # does not start, this container's log says why.
  setup:
    image: ghcr.io/catacomb5099/naviseerr-setup:develop
    restart: "no"
    environment:
      RUN_AS: *run-as
      SOULSEEK_USERNAME: *soulseek-username
      SOULSEEK_PASSWORD: *soulseek-password
      SHARE_LIBRARY: *share-library
      LIBRARY_DIR: *library-path
    volumes:
      - config:/config
      - slskd:/slskd
      - downloads:/downloads
      - incomplete:/incomplete
      - *library
      - curator-output:/curator/output
      - curator-history:/curator/history
      - curator-runs:/curator/runs

  # The Soulseek client. Its settings are written by setup on every start.
  slskd:
    image: slskd/slskd:0.26.0
    user: *run-as
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "50300:50300"
    volumes:
      - slskd:/app
      - downloads:/downloads
      - incomplete:/incomplete
      # What you share on Soulseek, read-only.
      - <<: *library
        target: /music
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5030/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  naviseerr:
    image: ghcr.io/catacomb5099/naviseerr:develop
    user: *run-as
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      ytmusic-adapter:
        condition: service_healthy
      # Started, not healthy: a Soulseek login problem must not keep the web app from starting.
      slskd:
        condition: service_started
    environment:
      TZ: *tz
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/naviseerr
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/naviseerr
      SPRING_R2DBC_USERNAME: naviseerr
      SPRING_R2DBC_PASSWORD: naviseerr
      YT_MUSIC_SERVICE_URL: http://ytmusic-adapter:8000
      SLSKD_URL: http://slskd:5030/api/v0/
      SLSKD_DOWNLOADS_DIR: /downloads
      SLSKD_INCOMPLETE_DIR: /incomplete
      LIBRARY_ROOT: /library
      # slskd's API key and the playlist maker's token come from this file, written by setup.
      SPRING_CONFIG_IMPORT: optional:file:/config/naviseerr.properties
      CURATOR_URL: http://croissant:8010
      CURATOR_FIRST_RUN_ON_START: "true"
      LOGGING_LEVEL_COM_CATACOMB5099_NAVISEERR_DOWNLOAD: INFO
    volumes:
      - config:/config:ro
      - downloads:/downloads
      - incomplete:/incomplete
      - *library

  # Makes the weekly "Made for you" suggested playlists. naviseerr works without it.
  croissant:
    image: ghcr.io/catacomb5099/croissant:develop
    user: *run-as
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      CURATOR_TOKEN_FILE: /config/curator.token
      DISCOGS_TOKEN: *discogs-token
      TZ: *tz
    volumes:
      - config:/config:ro
      - curator-output:/app/output
      - curator-history:/app/history
      - curator-runs:/app/runs

  # The web app: http://<this machine>:5056.
  client:
    image: ghcr.io/catacomb5099/naviseerr-client:develop
    restart: unless-stopped
    depends_on:
      naviseerr:
        condition: service_started
    ports:
      # To use another port, change the first number only (5055 is taken by Jellyseerr/Overseerr).
      - "5056:80"

volumes:
  postgres-data:
  config:
  slskd:
  downloads:
  incomplete:
  curator-output:
  curator-history:
  curator-runs:
